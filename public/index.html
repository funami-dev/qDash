<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>qDash</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-state="off">
  <header>
    <h1>qDash</h1>
    <div id="status" title="Tippen hält den Bildschirm wach">Nicht verbunden</div>
  </header>
  <nav>
    <button id="connect">WiCAN verbinden</button>
    <button id="demo" class="secondary">Demo</button>
    <button id="disconnect" class="secondary">Trennen</button>
  </nav>
  <main id="gauges"></main>
  <section class="panel">
    <button id="read-dtc" class="secondary">Fehlercodes lesen</button>
    <span id="dtcs"></span>
  </section>
  <details class="panel">
    <summary>ELM327-Log</summary>
    <pre id="log"></pre>
  </details>
  <script type="module" src="js/app.js"></script>
</body>
</html>
